  .font-display{ font-family:'Baloo 2', sans-serif; }

    content:"";

    background: var(--moss);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    transform: scaleX(1.4);
    opacity:.9;
    z-index:0;
    pointer-events:none;
  }
  .tile{
    background: var(--cream);
    border: 3px solid #E4DCC8;
    border-radius: 26px;
    box-shadow: 0 4px 0 #E4DCC8;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .tile:active{ transform: translateY(3px); box-shadow: 0 1px 0 #E4DCC8; }
  .tile.mastered{ border-color: var(--honey); box-shadow: 0 4px 0 var(--honey); }
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    border-radius:20px;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .dot{ width:10px; height:10px; border-radius:50%; background:#DDD3B8; }
  .dot.on{ background: var(--moss); }
  @keyframes shake{
    10%,90%{ transform: translateX(-3px); }
    20%,80%{ transform: translateX(5px); }
    30%,50%,70%{ transform: translateX(-8px); }
    40%,60%{ transform: translateX(8px); }
  }
  .shake{ animation: shake .5s; }
  @keyframes pop{
    0%{ transform: scale(.6); opacity:0; }
    60%{ transform: scale(1.12); opacity:1; }
    100%{ transform: scale(1); }
  }
  .pop{ animation: pop .35s ease-out; }
  @keyframes pulseDot{
    0%,100%{ transform: scale(1); opacity:1; }
    50%{ transform: scale(1.4); opacity:.6; }
  }
  .pulse{ animation: pulseDot 1s ease-in-out infinite; }
  @keyframes floatUp{
    0%{ transform: translateY(0) scale(1); opacity:1; }
    100%{ transform: translateY(-70px) scale(1.4); opacity:0; }
  }
  .confetti{ position:absolute; font-size:22px; animation: floatUp 1s ease-out forwards; pointer-events:none; }
  canvas{ touch-action:none; display:block; }
  .story-sentence{ transition: background .25s ease; }
  .story-highlight{ background: var(--honey); border-radius:6px; box-shadow: 0 0 0 3px var(--honey); }
  .story-word{ cursor:pointer; border-bottom:2px dotted #B9AE8E; }
  .story-word:active{ border-bottom-color: var(--lavender); color: var(--lavender); }

  const n = Math.ceil(Math.abs(a1 - a0) / 15);
  return Array.from({ length: n + 1 }, (_, i) => {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
  });
}

}
let progress;
// merge so progress saved by an older version gets the new letters and stars
try { progress = Object.assign(defaultProgress(), JSON.parse(localStorage.getItem(STORAGE_KEY))); }
catch(e){ progress = defaultProgress(); }
function saveProgress(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){} }

}
function speak(text, rate){
  if (!('speechSynthesis' in window)) return;
  speechToken++; // invalidates any running speakChain sequence
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (germanVoice) u.voice = germanVoice;
  u.lang = 'de-DE';
  u.rate = rate || 0.85;
  speechSynthesis.speak(u);
}
function letterSound(ch){
  const def = letterById(ch.toLowerCase());
  return def ? def.sound : ch;
}
function speakChain(texts, opts){
  opts = opts || {};
  if (!('speechSynthesis' in window)){ if (opts.onDone) opts.onDone(); return; }
  speechSynthesis.cancel();
  const myToken = ++speechToken;
  let i = 0;
  function next(){
    if (myToken !== speechToken) return; // a newer speech action took over
    if (i >= texts.length){ if (opts.onDone) opts.onDone(); return; }
    if (opts.onIndex) opts.onIndex(i);
    const u = new SpeechSynthesisUtterance(texts[i]);
    if (germanVoice) u.voice = germanVoice;
    u.lang = 'de-DE';
    u.rate = opts.rate || 0.7;
    u.onend = () => { if (myToken !== speechToken) return; i++; next(); };
    speechSynthesis.speak(u);
  }
  next();
}

/* ---------- Nachfahren (strict stroke order) ---------- */
// evenly spaced points, so matching behaves the same for long straight lines and dense curves
function densify(stroke, step){
  const out = [stroke[0]];
  for (let i = 1; i < stroke.length; i++){
    const [x0, y0] = stroke[i-1], [x1, y1] = stroke[i];
    const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step));
    for (let k = 1; k <= n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
  }
  return out;
}

function renderTrace(id, caseType){
  const l = letterById(id);
  const strokesNorm = l[caseType].map(s => densify(s, 5));
  const wrap = document.createElement('div');
  wrap.className = 'flex-1 flex flex-col relative z-10';
  wrap.appendChild(header(`${caseType === 'upper' ? id.toUpperCase() : id} schreiben`, () => go('detail', { id })));

  const body = document.createElement('div');
  body.className = 'flex-1 flex flex-col items-center px-6 max-w-md mx-auto w-full';
  body.innerHTML = `
    <div class="tile p-3 mb-4" style="position:relative;">
      <canvas id="traceCanvas" width="320" height="320" style="width:100%;max-width:320px;height:auto;touch-action:none;"></canvas>
    </div>
    <p id="hint" class="font-display text-lg text-center" style="color:var(--bark)">Starte beim Punkt und fahre die Linie nach</p>
  `;
  wrap.appendChild(body);
  app.appendChild(wrap);

  const canvas = document.getElementById('traceCanvas');
  const hint = document.getElementById('hint');
  const cctx = canvas.getContext('2d');
  const SIZE = 320;
  const TOL = 22; // normalized tolerance (0-100 space) — generous corridor for small hands
  const WINDOW = 7; // points ahead (5 units apart) we search for a match, so fast/jumpy strokes still register
  const OFFPATH_MULT = 2.6; // how far off the corridor counts as "drifting"
  const GRACE_FRAMES = 18; // consecutive drifting frames tolerated before a reset — avoids punishing brief wobbles

  let strokeIdx = 0;
  let progressIdx = 0;
  let drawing = false;
  let offCount = 0;
  let completedStrokes = []; // arrays of {x,y} in normalized space, one per finished stroke

  function toPx(pt){ return { x: pt[0]/100*SIZE, y: pt[1]/100*SIZE }; }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function drawGuideline(pts, color, width, dashed){
    cctx.beginPath();
    cctx.setLineDash(dashed ? [8,7] : []);
    cctx.lineJoin='round'; cctx.lineCap='round';
    cctx.strokeStyle = color; cctx.lineWidth = width;
    pts.forEach((p,i) => {
      const px = toPx(p);
      if (i===0) cctx.moveTo(px.x, px.y); else cctx.lineTo(px.x, px.y);
    });
    cctx.stroke();
    cctx.setLineDash([]);
  }

  function redraw(){
    cctx.clearRect(0,0,SIZE,SIZE);
    // faint baseline grid
    cctx.strokeStyle = '#EEE6D2'; cctx.lineWidth = 1;
    [15,42,80].forEach(y => { cctx.beginPath(); cctx.moveTo(0,y/100*SIZE); cctx.lineTo(SIZE,y/100*SIZE); cctx.stroke(); });

    // all strokes as light guide
    strokesNorm.forEach((s,i) => {
      if (i < strokeIdx) return; // already inked below
      drawGuideline(s, i===strokeIdx ? '#C9BE9E' : '#E9E3D2', 10, true);
    });

    // completed strokes, inked
    completedStrokes.forEach(s => drawGuideline(s, 'var(--moss)'.replace('var(--moss)','#4A7856'), 12, false));

    // current in-progress ink
    if (currentInk.length > 1) drawGuideline(currentInk.map(p=>[p.x/SIZE*100, p.y/SIZE*100]), '#4A7856', 12, false);

    // start dot pulse for current stroke
    if (!drawing && strokeIdx < strokesNorm.length){
      const startPt = toPx(strokesNorm[strokeIdx][0]);
      cctx.beginPath();
      cctx.arc(startPt.x, startPt.y, 10, 0, Math.PI*2);
      cctx.fillStyle = '#D9667A';
      cctx.fill();
    }
  }

  let currentInk = [];

  function getPos(evt){
    const rect = canvas.getBoundingClientRect();
    const scaleX = SIZE / rect.width, scaleY = SIZE / rect.height;
    const cx = (evt.clientX !== undefined ? evt.clientX : evt.touches[0].clientX);
    const cy = (evt.clientY !== undefined ? evt.clientY : evt.touches[0].clientY);
    return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
  }

  function resetStroke(bounce){
    drawing = false;
    progressIdx = 0;
    offCount = 0;
    currentInk = [];
    if (bounce){
      canvas.parentElement.classList.add('shake');
      setTimeout(()=>canvas.parentElement.classList.remove('shake'), 500);
    }
    redraw();
  }

  function onDown(evt){
    evt.preventDefault();
    const pos = getPos(evt);
    const startPx = toPx(strokesNorm[strokeIdx][0]);
    if (dist(pos, startPx) <= TOL/100*SIZE * 1.6){
      drawing = true;
      progressIdx = 0;
      offCount = 0;
      currentInk = [startPx];
      hint.textContent = 'Weiter der Linie folgen …';
    } else {
      canvas.parentElement.classList.add('shake');
      setTimeout(()=>canvas.parentElement.classList.remove('shake'), 500);
    }
  }

  function onMove(evt){
    if (!drawing) return;
    evt.preventDefault();
    const pos = getPos(evt);
    const stroke = strokesNorm[strokeIdx];
    // nearest point, not the furthest: on small letters the whole curve is within TOL of the finger,
    // and "furthest" would let progress race around the letter while the finger stays put
    let matched = -1, best = Infinity;
    for (let i = progressIdx; i < Math.min(stroke.length, progressIdx + WINDOW); i++){
      const d = dist(pos, toPx(stroke[i]));
      if (d <= TOL/100*SIZE && d < best){ matched = i; best = d; }
    }
    if (matched >= progressIdx){
      progressIdx = matched;
      offCount = 0;
      currentInk.push(pos);
      redraw();
      return;
    }
    // keep the ink flowing under the finger even off the exact corridor — feels natural, not laggy
    currentInk.push(pos);
    redraw();
    const targetPx = toPx(stroke[progressIdx]);
    if (dist(pos, targetPx) > TOL/100*SIZE * OFFPATH_MULT){
      offCount++;
      if (offCount > GRACE_FRAMES){
        resetStroke(true);
        hint.textContent = 'Nochmal! Starte beim Punkt';
      }
    } else {
      offCount = 0;
    }
  }

  function onUp(evt){
    if (!drawing) return;
    const stroke = strokesNorm[strokeIdx];
    if (progressIdx >= stroke.length - 3){ // up to 2 points (10 units) short of the end still counts
      completedStrokes.push(stroke);
      strokeIdx++;
      drawing = false;
      currentInk = [];
      if (strokeIdx >= strokesNorm.length){
        finishLetter();
        return;
      }
      hint.textContent = 'Gut! Nächster Strich';
      redraw();
    } else {
      resetStroke(true);
      hint.textContent = 'Nochmal! Bis zum Ende führen';
    }
  }

  function finishLetter(){
    progress[id][caseType] = true;
    saveProgress();
    speak(`Super! Das ist ein ${caseType === 'upper' ? 'großes' : 'kleines'} ${id}.`);
    celebrate(() => go('detail', { id }));
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointerleave', () => { if (drawing) resetStroke(false); });

  redraw();
}

/* ---------- Erkennen (Multiple Choice) ---------- */
// letters that look or sound alike make the best wrong answers
const SIMILAR = {
  a:'ä o e', b:'d p q h', c:'k s z', d:'b p q', e:'ä i a', f:'v t', g:'k q', h:'n k', i:'e l j', j:'i y',
  k:'g c', l:'i t', m:'n w', n:'m u h', o:'ö a u', p:'b d q', q:'p d g', r:'n l', s:'z ß c', t:'f l',
  u:'n ü v', v:'w u f', w:'v m', x:'k z', y:'j v', z:'s c', ä:'a e ö', ö:'o ü ä', ü:'u ö i', ß:'s b',
  sch:'s ch st sp', ch:'sch h', ei:'ie eu au', ie:'ei i', eu:'ei au', au:'eu ei', sp:'st sch', st:'sp sch', pf:'f p', qu:'q k',
};
function recognizeTask(){
  const all = [...LETTERS, ...GROUPS];
  const target = pick(all);
  const upper = target.id !== 'ß' && Math.random() < 0.5; // all options in the same case, ß has no capital
  const allowed = id => id !== target.id && !(upper && id === 'ß');
  const similar = shuffle(SIMILAR[target.id].split(' ').filter(allowed)).slice(0, 2);
  const rest = shuffle(all.map(x => x.id).filter(id => allowed(id) && !similar.includes(id)));
  return {
    show: '<div class="font-display text-xl">Was hörst du?</div>',
    say: target.sound,
    options: [target.id, ...similar, ...rest].slice(0, 4),
    answer: target.id,
    fmt: id => upper ? cap(id) : id,
    optClass: 'letterform text-4xl',
    onCorrect: () => { progress[target.id].recognizedCount++; saveProgress(); },
  };
}

/* ---------- Wörter ---------- */
function wordReady(word){
  return [...word.text].every(ch => {
    const id = ch.toLowerCase();
    const def = letterById(id);
    if (!def) return true;
    const isUpper = ch === ch.toUpperCase() && ch !== ch.toLowerCase();
    return isUpper ? progress[id].upper : progress[id].lower;
  });
}

function renderStoryRead(storyId){
  const story = STORIES.find(s => s.id === storyId);
  const self = !!story.questions;
  const wrap = document.createElement('div');
  wrap.className = 'flex-1 flex flex-col relative z-10';
  wrap.appendChild(header(story.title, () => { speechSynthesis.cancel(); go('stories', { self }); }));

  const body = document.createElement('div');
  body.className = 'flex-1 flex flex-col px-6 max-w-md mx-auto w-full';
  wrap.appendChild(body);
  app.appendChild(wrap);

  let page = 0;

  function splitSentences(text){
    return text.split(/(?<=[.!?])\s+/).filter(Boolean);
  }
  function wordsHtml(sentence){
    return sentence.split(/(\s+)/).map(tok => {
      if (!tok || /^\s+$/.test(tok)) return tok;
      return `<span class="story-word">${tok}</span>`;
    }).join('');
  }

  function renderPage(){
    speechSynthesis.cancel();
    const sentences = splitSentences(story.pages[page]);
    body.innerHTML = `
      <div class="text-center font-display text-sm mb-2" style="color:var(--bark)">Seite ${page+1} von ${story.pages.length}</div>

          ? '<div class="flex-1 text-center font-display text-base">Tippe auf einen Satz 🔊</div>'

        <button id="nextBtn" class="btn w-12 h-12 text-white text-xl" style="background:var(--bark)">${page === story.pages.length-1 ? (self ? '❓' : '🏁') : '→'}</button>
      </div>
      ${self ? '' : '<p class="text-center text-sm mb-3" style="color:var(--bark)">Tipp: Tippe ein Wort im Text an</p>'}
      <div id="wordPanel" class="tile p-4 mb-4 hidden"></div>
    `;
    const textEl = document.getElementById('pageText');
    textEl.innerHTML = sentences.map((s,i) => `<span data-i="${i}" class="story-sentence">${wordsHtml(s)}</span>`).join(' ');
    textEl.querySelectorAll('.story-word').forEach(wEl => {
      wEl.onclick = (e) => {
        e.stopPropagation();
        if (self) return readAloud([+wEl.parentElement.dataset.i], 0.8);
        const clean = wEl.textContent.replace(/[„"“”‚'’.,!?;:()–—]/g,'').trim();
        if (clean) onWordTap(clean, textEl);
      };
    });

    const prevBtn = document.getElementById('prevBtn');
    prevBtn.disabled = page === 0;
    prevBtn.style.opacity = page === 0 ? '.4' : '1';
    prevBtn.onclick = () => { if (page > 0){ page--; renderPage(); } };

    document.getElementById('nextBtn').onclick = () => {
      if (page < story.pages.length - 1){ page++; renderPage(); }
      else if (self) go('quiz', { item: {
        key: 'story-' + story.id, title: story.title, back: () => go('stories', { self }),
        tasks: story.questions.map(q => ({
          show: `<div class="font-display text-2xl text-center my-6">${q.q}</div>`,
          options: [q.a, ...q.o], answer: q.a, cols: 1, optClass: 'font-display text-xl',
        })),
      } });
      else { speechSynthesis.cancel(); go('stories'); }
    };

    // reads the sentences with the given indexes, highlighting the one being read
    function readAloud(idxs, rate){
      const spans = textEl.querySelectorAll('.story-sentence');
      speakChain(idxs.map(i => sentences[i]), {
        rate,
        onIndex: (k) => {
          spans.forEach(s => s.classList.remove('story-highlight'));
          if (spans[idxs[k]]) spans[idxs[k]].classList.add('story-highlight');
        },
        onDone: () => spans.forEach(s => s.classList.remove('story-highlight')),
      });
    }
    if (!self){
      const playPage = () => readAloud(sentences.map((_, i) => i), 0.65);
      document.getElementById('playBtn').onclick = playPage;
      playPage();
    }
  }

  function onWordTap(word, textEl){
    textEl.querySelectorAll('.story-sentence').forEach(s => s.classList.remove('story-highlight'));
    const panel = document.getElementById('wordPanel');
    panel.classList.remove('hidden');
    panel.innerHTML = `
      <div class="font-display text-sm mb-3 text-center" style="color:var(--bark)">Wort-Werkstatt</div>
      <div class="flex justify-center gap-2 flex-wrap" id="wpLetters"></div>
    `;
    const lettersWrap = document.getElementById('wpLetters');
    const chars = [...word];
    chars.forEach(ch => {
      const t = document.createElement('div');
      t.className = 'letterform text-2xl w-11 h-12 flex items-center justify-center rounded-xl pop';
      t.style.background = '#F3EEDD';
      t.style.color = 'var(--moss-dark)';
      t.style.border = '2px solid #E4DCC8';
      t.textContent = ch;
      lettersWrap.appendChild(t);
    });
    panel.scrollIntoView({ behavior:'smooth', block:'nearest' });
    const tiles = [...lettersWrap.children];
    speakChain(chars.map(letterSound), {
      rate: 0.75,
      onIndex: (i) => {
        tiles.forEach(t => t.style.boxShadow = 'none');
        if (tiles[i]) tiles[i].style.boxShadow = '0 0 0 3px var(--honey)';
      },
      onDone: () => {
        tiles.forEach(t => t.style.boxShadow = 'none');
        setTimeout(() => speak(word, 0.8), 200);
      },
    });
  }

  renderPage();
}

/* ---------- Hilfen für Übungen ---------- */
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function shake(el){ el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 500); }
// deals list entries in random order, no repeats until the list is used up
function deck(list, toTask){
  let pile = [];
  return () => { if (!pile.length) pile = shuffle(list); return toTask(pile.pop()); };
}
// answer + 3 wrong answers: typical mistakes first, then neighbours in `step`s
function choices(answer, candidates, lo, hi, step = 1){
  const opts = [answer];
  const add = c => { if (opts.length < 4 && c >= lo && c <= hi && !opts.includes(c)) opts.push(c); };
  shuffle(candidates).forEach(add);
  for (let d = 1; opts.length < 4; d++){ add(answer + d * step); add(answer - d * step); }
  return opts;
}

/* ---------- Übungsrunde (für alle Übungen gleich) ---------- */
// item: { key, title, back, make() | tasks[] }
// task: { show, say?, options, answer, fmt?, optClass?, cols?, keepOrder?, sayCorrect?, afterCorrect?(showEl, proceed), onCorrect?,
//         build?(area, miss, done) for tasks that are not "tap one of the answers" }
function renderQuiz(item){
  const total = item.tasks ? item.tasks.length : 10;
  let n = 0, score = 0;
  const wrap = document.createElement('div');
  wrap.className = 'flex-1 flex flex-col relative z-10';
  wrap.appendChild(header(item.title, item.back));
  const body = document.createElement('div');
  body.className = 'flex-1 flex flex-col items-center px-6 pb-8 max-w-md mx-auto w-full';
  wrap.appendChild(body);
  app.appendChild(wrap);

  function next(){
    if (!wrap.isConnected) return; // child left the exercise meanwhile
    if (n >= total) return finish();
    const task = item.tasks ? item.tasks[n] : item.make();
    let firstTry = true;
    body.innerHTML = `
      <div class="flex gap-1 mb-4">${Array.from({ length: total }, (_, i) => `<span class="dot ${i < n ? 'on' : ''}"></span>`).join('')}</div>
      <div id="qShow" class="w-full flex flex-col items-center mb-4">${task.show}</div>
      ${task.say ? '<button id="qHear" class="tile w-20 h-20 text-4xl mb-6">🔊</button>' : ''}
      <div id="qArea" class="grid ${task.cols === 1 ? 'grid-cols-1' : 'grid-cols-2'} gap-4 w-full"></div>
    `;
    if (task.say){ document.getElementById('qHear').onclick = () => speak(task.say); speak(task.say); }
    const area = document.getElementById('qArea');
    const done = () => { if (!wrap.isConnected) return; if (firstTry) score++; n++; celebrate(next); };
    if (task.build) return task.build(area, () => { firstTry = false; }, done);

    (task.keepOrder ? task.options : shuffle(task.options)).forEach(opt => {
      const b = document.createElement('button');
      b.className = `tile ${task.optClass || 'font-display text-4xl font-800'} py-5 px-2`;
      b.style.color = 'var(--moss-dark)';
      b.innerHTML = task.fmt ? task.fmt(opt) : opt;
      b.onclick = () => {
        if (opt !== task.answer){
          firstTry = false;
          b.disabled = true;
          b.style.opacity = '.35';
          return shake(b);
        }
        area.style.pointerEvents = 'none';
        if (task.say) document.getElementById('qHear').style.pointerEvents = 'none'; // would cut off afterCorrect speech
        b.style.background = '#DCEFD8';
        if (task.onCorrect) task.onCorrect();
        if (task.sayCorrect) speak(task.sayCorrect);
        if (task.afterCorrect) task.afterCorrect(document.getElementById('qShow'), done);
        else setTimeout(done, task.sayCorrect ? 1800 : 300);
      };
      area.appendChild(b);
    });
  }

  function finish(){
    const needed = Math.ceil(total * 0.8), star = score >= needed;
    if (star){ progress.stars[item.key] = true; saveProgress(); }
    const msg = star ? 'Super, du hast einen Stern!' : `Für einen Stern brauchst du ${needed} richtige. Probier es nochmal!`;
    body.innerHTML = `
      <div class="text-8xl mt-8 mb-4 pop">${star ? '⭐' : '🌱'}</div>
      <div class="font-display text-2xl text-center mb-2">${score} von ${total} beim ersten Versuch richtig</div>
      <p class="font-display text-lg text-center mb-8">${msg}</p>
      <div class="grid grid-cols-2 gap-3 w-full">
        <button id="againBtn" class="btn py-4 text-white text-lg" style="background:var(--moss)">Nochmal</button>
        <button id="doneBtn" class="btn py-4 text-white text-lg" style="background:var(--bark)">Fertig</button>
      </div>
    `;
    speak(msg);
    document.getElementById('againBtn').onclick = () => { n = 0; score = 0; next(); };
    document.getElementById('doneBtn').onclick = item.back;
  }

  next();
}

/* ---------- Mathe ---------- */
const flip = x => x > 9 && x < 100 && x % 10 ? +String(x).split('').reverse().join('') : x; // 47 -> 74
function calcTask(text, answer, candidates, hi){
  return {
    show: `<div class="font-display text-6xl font-800 my-8" style="color:var(--moss-dark)">${text} = ?</div>`,
    options: choices(answer, candidates, 0, hi), answer,
  };
}
function plus20(){
  const a = rand(1, 10), b = rand(1, 10), s = a + b;
  return calcTask(`${a} + ${b}`, s, [s - 1, s + 1, s - 2, s + 2, s - 10, Math.abs(a - b)], 20);
}
function minus20(){
  const b = rand(1, 10), a = rand(b, 20), r = a - b;
  return calcTask(`${a} − ${b}`, r, [r - 1, r + 1, r - 2, r + 2, r + 10, a + b], 20);
}
function plus100(tens){
  if (tens){
    const a = rand(1, 9) * 10, b = rand(1, 10 - a / 10) * 10, s = a + b;
    return calcTask(`${a} + ${b}`, s, [s - 10, s + 10, s - 20, s + 20], 100);
  }
  const a = rand(11, 89), b = rand(2, 100 - a), s = a + b;
  // typical mistakes: forgot the carry (s - 10), added only the ones, swapped digits
  return calcTask(`${a} + ${b}`, s, [s - 1, s + 1, s - 10, s + 10, flip(s), a + b % 10], 100);
}
function minus100(tens){
  if (tens){
    const a = rand(2, 10) * 10, b = rand(1, a / 10) * 10, r = a - b;
    return calcTask(`${a} − ${b}`, r, [r - 10, r + 10, r - 20, r + 20], 100);
  }
  const a = rand(20, 100), b = rand(2, a - 1), r = a - b;
  // typical mistake: subtracting the smaller ones digit from the bigger one (83 − 29 -> 66)
  const onesSwapped = (Math.floor(a / 10) - Math.floor(b / 10)) * 10 + Math.abs(a % 10 - b % 10);
  return calcTask(`${a} − ${b}`, r, [r - 1, r + 1, r - 10, r + 10, flip(r), onesSwapped], 100);
}
function einmaleins(){
  const a = rand(1, 10), b = rand(1, 10), p = a * b;
  return calcTask(`${a} · ${b}`, p, [(a + 1) * b, (a - 1) * b, a * (b + 1), a * (b - 1), p + 1, p - 1, a + b], 100);
}
// Zwanzigerfeld / Hunderterfeld: rows of 10 with a gap after 5, filled row by row
function fieldTask(max){
  const n = rand(1, max), size = max > 20 ? 18 : 26;
  let rows = '';
  for (let r = 0; r < max / 10; r++){
    let cells = '';
    for (let c = 0; c < 10; c++){
      const on = r * 10 + c < n;
      cells += `<span style="width:${size}px;height:${size}px;border-radius:50%;margin-left:${c === 5 ? 8 : 0}px;border:2px solid ${on ? 'var(--berry)' : '#D9CFB5'};background:${on ? 'var(--berry)' : 'transparent'}"></span>`;
    }
    rows += `<div class="flex" style="gap:4px;margin-top:${r === 5 ? 8 : 0}px">${cells}</div>`;
  }
  return {
    show: `<div class="tile p-4 flex flex-col" style="gap:4px">${rows}</div>`,
    say: 'Wie viele Punkte?',
    options: choices(n, [n - 1, n + 1, n - 2, n + 2, n - 5, n + 5, n - 10, n + 10, flip(n)], 1, max), answer: n,
  };
}

/* ---------- Uhr ---------- */
const CLOCK_MINUTES = { 1:[0, 30], 2:[0, 15, 30, 45], 3:Array.from({ length:12 }, (_, i) => i * 5) };
const clockVal = (h, m) => ((h + 11) % 12 + 1) * 60 + m; // wraps the hour into 1..12
const fmtTime = v => `${Math.floor(v / 60)}:${String(v % 60).padStart(2, '0')}`;
function timeWords(v){
  const h = Math.floor(v / 60), m = v % 60, next = h % 12 + 1;
  if (m === 0) return `${h} Uhr`;
  if (m === 30) return `halb ${next}`;
  if (m === 15) return `Viertel nach ${h}`;
  if (m === 45) return `Viertel vor ${next}`;
  return m < 30 ? `${m} nach ${h}` : `${60 - m} vor ${next}`;
}
function clockSvg(h, m){
  const at = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [100 + r * Math.cos(a), 100 + r * Math.sin(a)]; };
  const line = (deg, r1, r2, w, color) => {
    const [x1, y1] = at(deg, r1), [x2, y2] = at(deg, r2);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
  };
  let face = '';
  for (let i = 0; i < 60; i++) face += line(i * 6, i % 5 ? 84 : 77, 90, i % 5 ? 1.5 : 3.5, '#5B4636');
  for (let i = 1; i <= 12; i++){
    const [x, y] = at(i * 30, 64);
    face += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="800" fill="#5B4636">${i}</text>`;
  }
  return `<svg viewBox="0 0 200 200" width="230" height="230" class="mb-2">
    <circle cx="100" cy="100" r="96" fill="#FBF8F1" stroke="#4A7856" stroke-width="6"/>${face}
    ${line((h % 12 + m / 60) * 30, 0, 45, 9, '#5B4636')}${line(m * 6, 0, 74, 5, '#D9667A')}
    <circle cx="100" cy="100" r="6" fill="#5B4636"/></svg>`;
}
function clockTask(stage){
  const M = CLOCK_MINUTES[stage], h = rand(1, 12), m = pick(M), answer = clockVal(h, m);
  // typical mistakes: hour one off (the hour hand is between two numbers), nearby minutes
  const near = M.filter(x => x !== m && Math.abs(x - m) <= (stage === 3 ? 10 : 30));
  const candidates = [clockVal(h + 1, m), clockVal(h - 1, m), ...near.map(x => clockVal(h, x)), ...near.map(x => clockVal(h + 1, x))];
  return {
    show: clockSvg(h, m), say: 'Wie spät ist es?',
    options: choices(answer, candidates, 0, 9999), answer, fmt: fmtTime,
    sayCorrect: `Es ist ${timeWords(answer)}.`,
  };
}

/* ---------- Geld (Beträge in Cent) ---------- */
const NOTE_COLORS = { 500:'#8E9B90', 1000:'#D9667A', 2000:'#5A8FD0', 5000:'#E8953A' };
const fmtMoney = c => c % 100 ? `${Math.floor(c / 100)},${String(c % 100).padStart(2, '0')} €` : `${c / 100} €`;
function moneyPiece(c){
  if (NOTE_COLORS[c]) return `<span class="inline-flex items-center justify-center font-display font-800 text-white text-xl" style="width:88px;height:48px;border-radius:6px;background:${NOTE_COLORS[c]}">${c / 100} €</span>`;
  const size = { 200:58, 100:54, 50:50, 20:46, 10:42 }[c];
  // 1 €: silver centre, gold ring; 2 €: gold centre, silver ring; cent coins: gold
  const [inner, ring] = c === 100 ? ['#D5D8DC', '#E3C567'] : c === 200 ? ['#E3C567', '#D5D8DC'] : ['#E3C567', '#C9A53E'];
  return `<span class="inline-flex items-center justify-center font-display font-800" style="width:${size}px;height:${size}px;border-radius:50%;background:${inner};border:5px solid ${ring};color:#5B4636;font-size:15px;line-height:1">${c >= 100 ? c / 100 + ' €' : c + ' ct'}</span>`;
}
function moneyTask(stage){
  const denoms = stage === 1 ? [2000, 1000, 500, 200, 100] : [5000, 2000, 1000, 500, 200, 100, 50, 20, 10];
  const total = stage === 1 ? rand(1, 20) * 100 : rand(1, 99) * 100 + rand(1, 9) * 10;
  const pieces = [];
  // one of the two biggest pieces that still fit, so amounts don't turn into piles of small coins
  for (let rest = total; rest > 0; ){ const d = pick(denoms.filter(x => x <= rest).slice(0, 2)); pieces.push(d); rest -= d; }
  pieces.sort((a, b) => b - a);
  const step = stage === 1 ? 100 : 10;
  // typical mistakes: a piece forgotten or counted twice, a euro or ten off
  const candidates = [total - pieces[0], total + pieces[pieces.length - 1], total + 100, total - 100, total + 1000, total - 1000,
    ...(stage === 2 ? [total + 10, total - 10, total + 50, total - 50] : [total + 200, total - 200])];
  const euros = Math.floor(total / 100), cents = total % 100;
  return {
    show: `<div class="tile p-4 flex flex-wrap gap-2 justify-center items-center w-full">${pieces.map(moneyPiece).join('')}</div>`,
    say: 'Wie viel Geld ist das?',
    options: choices(total, candidates, step, stage === 1 ? 3000 : 10000, step), answer: total,
    fmt: fmtMoney, optClass: 'font-display text-3xl font-800',
    sayCorrect: `${euros} Euro${cents ? ` ${cents}` : ''}`,
  };
}

function silbenTask(x){

      <div class="font-display text-lg mt-2">Wie viele Silben?</div>`,
    say: word,
    options: [1, 2, 3, 4], keepOrder: true, answer: x.parts.length,
    // recording: whole word, then syllable by syllable; each syllable (blue/red like in school) pops while it is spoken
    afterCorrect(el, proceed){
      const wordEl = el.querySelector('#silbenWort');
      wordEl.innerHTML = x.parts.map((p, i) => `<span style="display:inline-block;color:${i % 2 ? 'var(--berry)' : '#3B6FB6'}">${p}</span>`).join('');
      const spans = [...wordEl.children];
      let finished = false;
      const finish = () => { if (!finished){ finished = true; proceed(); } };
      const fallback = () => { speak(word); setTimeout(finish, 1800); }; // one-syllable words, or clip not loaded
      setTimeout(finish, 10000); // never get stuck if audio events don't fire
      if (!clipUrl) return fallback();
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      const audio = new Audio(clipUrl);
      audio.onplaying = () => SILBEN_TIMES[name].forEach((t, i) => setTimeout(() => { spans[i].style.animation = 'pop .45s ease-out'; }, t * 1000));
      audio.onended = () => setTimeout(finish, 400);
      audio.play().catch(fallback);
    },
  };
}

function schreibTask(x){
  const chars = [...x.w];
  return {
    show: `<div class="text-7xl mb-2">${x.e}</div><div class="font-display text-lg">Schreibe das Wort</div>`,
    say: x.w,
    build(area, miss, done){
      area.className = 'w-full flex flex-col items-center gap-6';
      area.innerHTML = '<div id="slots" class="flex gap-2 flex-wrap justify-center"></div><div id="pool" class="flex gap-2 flex-wrap justify-center"></div>';
      const slots = chars.map(() => {
        const s = document.createElement('div');
        s.className = 'letterform text-3xl w-12 h-14 flex items-center justify-center rounded-xl';
        s.style.border = '3px dashed #D9CFB5';
        s.style.color = 'var(--moss-dark)';
        area.querySelector('#slots').appendChild(s);
        return s;
      });
      const lower = x.w.toLowerCase();
      const extra = shuffle([...'abdefgiklmnoprstuw'].filter(c => !lower.includes(c))).slice(0, 3);
      let pos = 0;
      shuffle([...chars, ...extra]).forEach(ch => {
        const b = document.createElement('button');
        b.className = 'tile letterform text-3xl w-14 h-16';
        b.style.color = 'var(--moss-dark)';
        b.textContent = ch;
        b.onclick = () => {
          if (ch !== chars[pos]){
            miss();
            // grey out only letters that are not needed later in the word
            if (!chars.slice(pos).includes(ch)){ b.disabled = true; b.style.opacity = '.35'; }
            return shake(b);
          }
          slots[pos].textContent = ch;
          slots[pos].style.border = '3px solid var(--moss)';
          b.style.visibility = 'hidden';
          pos++;
          if (pos < chars.length) return speak(letterSound(ch));
          speak(x.w);
          setTimeout(done, 1200);
        };
        area.querySelector('#pool').appendChild(b);
      });
    },
  };
}
